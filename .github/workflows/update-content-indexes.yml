
name: Update portfolio content indexes

on:
  push:
    branches: [main]
    paths:
      - 'content/projects/**'
      - 'content/artefacts/**'
      - 'content/sections/**'
      - 'scripts/build_indexes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate content indexes
        run: python3 scripts/build_indexes.py

      - name: Commit updated indexes if needed
        run: |
          if git diff --quiet -- data/projects-index.json data/artefacts-index.json data/sections-index.json; then
            echo 'Indexes already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/projects-index.json data/artefacts-index.json data/sections-index.json
          git commit -m 'Update portfolio content indexes'
          git push
