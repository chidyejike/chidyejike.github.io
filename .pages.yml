media:
  - name: images
    label: Images
    input: media/images
    output: media/images
    categories: [image]
  - name: documents
    label: Documents and spreadsheets
    input: media/docs
    output: media/docs
    categories: [document, spreadsheet, image]
content:
  - name: profile
    label: Profile and sections
    type: file
    path: data/profile.json
    format: json
    fields:
      - {name: name, label: Display name, type: string}
      - {name: role, label: Professional title, type: string}
      - {name: headline, label: Homepage headline, type: string}
      - {name: intro, label: Introduction, type: text}
      - {name: about, label: About me, type: text}
      - {name: sectors, label: Cross-sector experience, type: string}
      - {name: email, label: Contact email, type: string}
      - {name: linkedin, label: LinkedIn URL, type: string}
      - {name: show_about, label: Show About, type: boolean}
      - {name: show_experience, label: Show Experience, type: boolean}
      - {name: show_projects, label: Show Projects, type: boolean}
      - {name: show_artefacts, label: Show Artefacts, type: boolean}
      - {name: show_contact, label: Show Contact, type: boolean}
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: '{primary}.json'
    view: {primary: title}
    fields:
      - {name: title, label: Project title, type: string, required: true}
      - {name: category, label: Category, type: string}
      - {name: summary, label: Summary, type: text}
      - {name: challenge, label: Business challenge, type: text}
      - {name: approach, label: My contribution, type: text}
      - {name: outcome, label: Outcome, type: text}
      - {name: demo_url, label: Live Demo URL, type: string}
      - {name: featured, label: Featured, type: boolean}
      - {name: published, label: Visible on website, type: boolean}
  - name: artefacts
    label: Artefact library
    type: collection
    path: content/artefacts
    format: json
    filename: '{primary}.json'
    view: {primary: title}
    fields:
      - {name: title, label: Artefact name, type: string, required: true}
      - {name: category, label: Category, type: select, options: {values: [Requirements, Process, Testing, Analysis, Other]}}
      - {name: project, label: Related project, type: string}
      - {name: description, label: Description, type: text}
      - {name: file, label: Document upload, type: file, options: {media: documents, image}}
      - {name: published, label: Visible on website, type: boolean}

  - name: custom_sections
    label: Custom Sections
    type: collection
    path: content/sections
    format: json
    filename: '{primary}.json'
    view: {primary: title}
    fields:
      - {name: title, label: Section title, type: string, required: true}
      - {name: subtitle, label: Short introduction, type: text}
      - {name: body, label: Main content, type: rich-text}
      - {name: image, label: Image, type: image, options: {media: images}}
      - {name: link_label, label: Link text, type: string}
      - {name: link_url, label: Link URL, type: string}
      - {name: document, label: Attached document, type: file, options: {media: documents}}
      - {name: order, label: Display order (600 = bottom; 150 = between About and Experience), type: number}
      - {name: published, label: Visible on website, type: boolean}
